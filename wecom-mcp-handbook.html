<style>
  :root {
    --ink: #0a0a0a;
    --blue: #002FA7;
    --paper: #fafaf8;
    --paper-edge: #f0eee9;
    --grey: #737373;
    --light: #E8EAF6;
    --green: #2E7D32;
    --red: #C62828;
    --amber: #F57F17;
    --radius: 4px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: auto; }
  body {
    font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #1a1a1a;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 70px 20px 24px;
  }

  /* Top nav bar */
  .topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:300;background:rgba(20,20,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
  .topbar-in{max-width:1400px;margin:0 auto;height:100%;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
  .brand{font-weight:700;color:#fff;font-size:15px;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:#5B8DEF;display:inline-block}
  nav.bn a{color:rgba(255,255,255,.7);text-decoration:none;font-size:14px;margin-left:18px;font-weight:600;transition:.2s}
  nav.bn a:hover{color:#fff}

  /* Book container */
  .book {
    position: relative;
    width: min(1400px, 96vw);
    height: min(860px, 86vh);
    perspective: 2000px;
  }

  /* Book shadow */
  .book::before {
    content: ''; position: absolute; bottom: -20px; left: 2%; right: 2%;
    height: 30px; background: radial-gradient(ellipse, rgba(0,0,0,0.4), transparent 70%);
    z-index: 0; filter: blur(8px);
  }

  /* Pages */
  .page {
    position: absolute; top: 0; left: 50%;
    width: 50%; height: 100%;
    background: var(--paper);
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
  }
  .page.flipped { transform: rotateY(-180deg); }
  .page.left { left: 0; transform-origin: right center; }
  .page.left.flipped { transform: rotateY(180deg); }

  /* Page inner */
  .page-inner {
    position: absolute; inset: 0;
    padding: 50px 44px 56px;
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .page-inner::-webkit-scrollbar { width: 3px; }
  .page-inner::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

  /* Back of page (mirror) */
  .page-back {
    position: absolute; inset: 0;
    background: var(--paper);
    transform: rotateY(180deg);
    backface-visibility: hidden;
    overflow: hidden;
  }
  .page-front { backface-visibility: hidden; }

  /* Spine effect */
  .page::before {
    content: ''; position: absolute; top: 0; bottom: 0;
    width: 12px; pointer-events: none; z-index: 5;
  }
  .page:not(.left)::before { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.08), transparent); }
  .page.left::before { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.08), transparent); }

  /* Page number */
  .page-num {
    position: absolute; bottom: 16px; left: 0; right: 0;
    text-align: center; font-size: 11px; color: var(--grey);
    letter-spacing: 0.15em; font-weight: 500;
  }

  /* Typography */
  .page-label {
    font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--blue); font-weight: 600; margin-bottom: 10px;
  }
  .page h2 {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(26px, 4vw, 38px); font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 14px;
  }
  .page .lead { font-size: 16px; color: var(--grey); margin-bottom: 24px; line-height: 1.6; }

  /* Cover */
  .cover {
    background: linear-gradient(135deg, var(--blue) 0%, #001a5c 100%);
    color: #fff; justify-content: center; align-items: center; text-align: center;
  }
  .cover .page-inner { justify-content: center; align-items: center; }
  .cover-label {
    font-size: 13px; letter-spacing: 0.4em; text-transform: uppercase;
    color: rgba(255,255,255,0.6); font-weight: 500; margin-bottom: 20px;
  }
  .cover h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(36px, 6vw, 56px); font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 20px;
  }
  .cover p { font-size: 17px; color: rgba(255,255,255,0.7); max-width: 360px; }
  .cover-stats {
    margin-top: 32px; display: flex; gap: 28px;
  }
  .cover-stat strong { display: block; font-size: 40px; font-weight: 800; }
  .cover-stat span { font-size: 13px; color: rgba(255,255,255,0.5); }

  /* TOC */
  .toc-list { list-style: none; }
  .toc-item {
    display: flex; align-items: baseline; gap: 8px;
    padding: 10px 0; border-bottom: 1px dotted #ddd; cursor: pointer;
    transition: color 0.2s;
  }
  .toc-item:hover { color: var(--blue); }
  .toc-item .toc-dot { flex: 1; border-bottom: 1px dotted #ccc; transform: translateY(-3px); }
  .toc-item .toc-num { font-size: 13px; color: var(--grey); font-weight: 600; min-width: 28px; }
  .toc-item .toc-title { font-size: 17px; font-weight: 500; }
  .toc-item .toc-page { font-size: 13px; color: var(--grey); }

  /* Module content */
  .module-icon { font-size: 44px; margin-bottom: 12px; }
  .module-badge {
    display: inline-block; font-size: 13px; padding: 5px 14px;
    border-radius: 16px; font-weight: 600;
    background: var(--light); color: var(--blue); margin-bottom: 18px;
  }

  .cap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
  @media (max-width: 600px) { .cap-grid { grid-template-columns: 1fr; } }
  .cap-box { padding: 20px; border-radius: 6px; font-size: 15px; }
  .cap-box.can { background: rgba(46,125,50,0.06); border-left: 2px solid var(--green); }
  .cap-box.cannot { background: rgba(194,40,40,0.05); border-left: 2px solid var(--red); }
  .cap-box h4 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .cap-box.can h4 { color: var(--green); }
  .cap-box.cannot h4 { color: var(--red); }
  .cap-box ul { list-style: none; }
  .cap-box li { padding: 3px 0 3px 18px; position: relative; font-size: 13px; line-height: 1.6; }
  .cap-box.can li::before { content: "✓"; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 12px; }
  .cap-box.cannot li::before { content: "✗"; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 12px; }

  .tool-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .tool-chip {
    font-size: 12px; padding: 5px 12px; border-radius: 4px;
    background: #fff; border: 1px solid #e0e0e0; color: var(--ink);
  }

  .case-card {
    background: #fff; border-radius: 6px; padding: 18px 22px;
    margin-bottom: 14px; border: 1px solid #eee;
  }
  .case-label { font-size: 11px; font-weight: 700; color: var(--amber); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .case-card p { font-size: 14px; }
  .case-card strong { color: var(--blue); }

  .limit-banner {
    font-size: 13px; color: var(--grey); padding: 14px 18px;
    background: rgba(245,127,23,0.06); border-radius: 6px;
    border-left: 2px solid var(--amber);
  }
  .limit-banner strong { color: var(--amber); }

  .scn-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .scn-table th { text-align: left; padding: 10px 12px; background: var(--blue); color: #fff; font-weight: 600; font-size: 12px; }
  .scn-table td { padding: 10px 12px; border-bottom: 1px solid #eee; }
  .scn-table tr:hover td { background: var(--light); }

  .lim-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lim-table th { text-align: left; padding: 10px 12px; background: var(--light); color: var(--blue); font-weight: 600; font-size: 12px; }
  .lim-table td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
  .lim-table .lim-name { font-weight: 600; white-space: nowrap; }

  /* Nav controls */
  .nav-controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 16px; z-index: 100;
  }
  .nav-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1);
    color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px); transition: all 0.2s;
  }
  .nav-btn:hover { background: var(--blue); border-color: var(--blue); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Page counter */
  .page-counter {
    position: fixed; top: 70px; right: 24px; z-index: 100;
    font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 0.1em;
  }
  .page-counter strong { color: #fff; }

  /* Spread container (two pages visible) */
  .spread {
    position: relative; width: 100%; height: 100%;
    display: flex;
  }
  .spread-left, .spread-right {
    width: 50%; height: 100%; position: relative;
  }

  /* Animate content in */
  .page.active .page-inner > * {
    animation: fadeInUp 0.5s ease forwards;
    opacity: 0;
  }
  .page.active .page-inner > *:nth-child(1) { animation-delay: 0.15s; }
  .page.active .page-inner > *:nth-child(2) { animation-delay: 0.25s; }
  .page.active .page-inner > *:nth-child(3) { animation-delay: 0.35s; }
  .page.active .page-inner > *:nth-child(4) { animation-delay: 0.45s; }
  .page.active .page-inner > *:nth-child(5) { animation-delay: 0.55s; }
  .page.active .page-inner > *:nth-child(6) { animation-delay: 0.65s; }
  .page.active .page-inner > *:nth-child(7) { animation-delay: 0.75s; }
  .page.active .page-inner > *:nth-child(8) { animation-delay: 0.85s; }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Book cover closed state */
  .book-cover-closed .page:not(.cover-page) { display: none; }
</style>
</head>

    caseText: '你说：<strong>"查一下康佳对接人的企微账号"</strong><br>我做：搜索"康佳" → 返回匹配成员和 userid → 可直接用于发消息或邮件',
    limit: '仅支持搜索，不支持修改。'
  },
  // 10: 场景速查
  { type: 'scenario', title: '🎯 场景速查', content: `
    <table class="scn-table">
      <tr><th>你说</th><th>模块</th><th>做到什么程度</th></tr>
      <tr><td>"看今天群里有没有重要消息"</td><td>消息</td><td>拉取7天内消息，筛选汇总</td></tr>
      <tr><td>"把这文件发到XX群"</td><td>消息</td><td>机器人身份发到指定群</td></tr>
      <tr><td>"搜一下关于XX的邮件"</td><td>邮件</td><td>搜索邮件，读取正文附件</td></tr>
      <tr><td>"发邮件给XX，附上文件"</td><td>邮件</td><td>上传附件并发送</td></tr>
      <tr><td>"建个在线表格填数据"</td><td>文档</td><td>创建文档，写入，设权限</td></tr>
      <tr><td>"找一下XX文档"</td><td>文档</td><td>搜索全量文档，返回链接</td></tr>
      <tr><td>"建个待办"</td><td>待办</td><td>创建待办，指定人和时间</td></tr>
      <tr><td>"约XX开会，找有空的时间"</td><td>日程</td><td>查空闲，推荐时间，创建</td></tr>
      <tr><td>"上次XX会议纪要拉出来"</td><td>会议</td><td>搜索会议，拉取转写原文</td></tr>
      <tr><td>"把文件传到微盘"</td><td>微盘</td><td>上传到指定文件夹</td></tr>
      <tr><td>"查XX的企微账号"</td><td>通讯录</td><td>搜索成员，获取userid</td></tr>
      <tr><td>"回款报表发邮件+发群"</td><td>邮件+消息</td><td>邮件发送+群通知，一条龙</td></tr>
    </table>
  `},
  // 11: 全局限制
  { type: 'limits', title: '⚠️ 全局限制', content: `
    <table class="lim-table">
      <tr><th>限制项</th><th>说明</th></tr>
      <tr><td class="lim-name">消息回溯</td><td>仅支持最近 7 天的聊天记录</td></tr>
      <tr><td class="lim-name">群聊参与</td><td>机器人必须在群内才能读取消息</td></tr>
      <tr><td class="lim-name">权限依赖</td><td>实际功能取决于管理后台授予的权限</td></tr>
      <tr><td class="lim-name">异步操作</td><td>文档读取、微盘下载需先提交再轮询</td></tr>
      <tr><td class="lim-name">消息长度</td><td>文本 2048 字符，Markdown 20480 字节</td></tr>
      <tr><td class="lim-name">删除操作</td><td>大多数模块不支持删除</td></tr>
      <tr><td class="lim-name">非企微内容</td><td>无法操作飞书文档、个人微信等</td></tr>
    </table>
    <div style="text-align:center;margin-top:40px;color:var(--grey);font-size:13px;">
      <p>这份手册会随着实际使用持续更新</p>
      <p style="margin-top:8px;">8 个模块 · 103 个工具 · 2026年8月 · Hermes Agent</p>
    </div>
  `},
];

// === Render pages ===
const spread = document.getElementById('spread');
let currentSpread = 0; // 0 = cover+toc, 1 = page1+2, etc.
const totalSpreads = Math.ceil(pages.length / 2);

function renderPage(pageData, pageIdx) {
  if (!pageData) return '';
  const pageNum = pageIdx + 1;
  let inner = '';

  if (pageData.type === 'cover') {
    inner = `<div class="page-inner cover">${pageData.content}</div>`;
  } else if (pageData.type === 'toc') {
    inner = `<div class="page-inner">
      <div class="page-label">目录</div>
      <h2>${pageData.title}</h2>
      ${pageData.content}
      <div class="page-num">${pageNum}</div>
    </div>`;
  } else if (pageData.type === 'module') {
    const tools = pageData.tools.map(t => `<span class="tool-chip">${t}</span>`).join('');
    const canList = pageData.can.map(c => `<li>${c}</li>`).join('');
    const cannotList = pageData.cannot.map(c => `<li>${c}</li>`).join('');
    inner = `<div class="page-inner">
      <div class="page-label">${pageData.label}</div>
      <span class="module-icon">${pageData.icon}</span>
      <h2>${pageData.title}</h2>
      <div class="lead">共 ${pageData.badge}</div>
      <div class="module-badge">${pageData.badge}</div>
      <div class="tool-list">${tools}</div>
      <div class="cap-grid">
        <div class="cap-box can"><h4>✓ 能做</h4><ul>${canList}</ul></div>
        <div class="cap-box cannot"><h4>✗ 不能做</h4><ul>${cannotList}</ul></div>
      </div>
      <div class="case-card"><div class="case-label">案例</div><p>${pageData.caseText}</p></div>
      ${pageData.limit ? `<div class="limit-banner"><strong>限制：</strong>${pageData.limit}</div>` : ''}
      <div class="page-num">${pageNum}</div>
    </div>`;
  } else if (pageData.type === 'scenario' || pageData.type === 'limits') {
    inner = `<div class="page-inner">
      <h2>${pageData.title}</h2>
      <div class="lead" style="margin-bottom:16px;">${pageData.type === 'scenario' ? '遇到这些事，直接跟我说。' : '使用前必须知道的边界。'}</div>
      ${pageData.content}
      <div class="page-num">${pageNum}</div>
    </div>`;
  }
  return inner;
}

function renderSpread() {
  const leftIdx = currentSpread * 2;
  const rightIdx = leftIdx + 1;
  const leftPage = pages[leftIdx];
  const rightPage = pages[rightIdx];

  spread.innerHTML = `
    <div class="spread-left">
      <div class="page active" style="position:absolute;top:0;left:0;width:100%;height:100%;">
        ${renderPage(leftPage, leftIdx)}
      </div>
    </div>
    <div class="spread-right">
      <div class="page active" style="position:absolute;top:0;left:0;width:100%;height:100%;">
        ${rightPage ? renderPage(rightPage, rightIdx) : '<div class="page-inner" style="display:flex;align-items:center;justify-content:center;color:var(--grey);"><p style="font-size:14px;">— 完 —</p></div>'}
      </div>
    </div>
  `;

  // Trigger animation
  requestAnimationFrame(() => {
    spread.querySelectorAll('.page.active').forEach(p => p.classList.remove('active'));
    requestAnimationFrame(() => {
      spread.querySelectorAll('.page').forEach(p => p.classList.add('active'));
    });
  });

  // Update counter
  document.getElementById('curPage').textContent = Math.min(rightIdx + 1, pages.length);
  document.getElementById('totalPages').textContent = pages.length;
  document.getElementById('prevBtn').disabled = currentSpread === 0;
  document.getElementById('nextBtn').disabled = currentSpread >= totalSpreads - 1;
}

function flipForward() {
  if (currentSpread < totalSpreads - 1) {
    currentSpread++;
    renderSpread();
  }
}

function flipBack() {
  if (currentSpread > 0) {
    currentSpread--;
    renderSpread();
  }
}

function goToPage(pageIdx) {
  currentSpread = Math.floor(pageIdx / 2);
  renderSpread();
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); flipForward(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); flipBack(); }
});

// Touch / swipe
let touchStartX = 0;
document.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -50) flipForward();
  if (dx > 50) flipBack();
});

// Init
renderSpread();
</script>
</body>
</html>
